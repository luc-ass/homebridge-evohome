name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Lowest supported version from engines.node.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Lint, typecheck and test
        run: npm run check

      - name: Build
        run: npm run build

      # Pre-releases (1.0.0-beta.x) go out under the "beta" tag so that
      # `npm install homebridge-evohome` still yields the stable version.
      - name: Determine npm tag
        id: tag
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "value=beta" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{ secrets.NPM_TOKEN }}
          tag: ${{ steps.tag.outputs.value }}
